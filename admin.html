<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Panel · Flor de Prenda</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="admin.css">
    <link rel="icon" type="image/png" href="logo-flor.png">

  <style>
    /* Tira de fotos de la prenda */
    .admin-fotos {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 10px 0;
    }
    .admin-foto-item {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .admin-foto-marco {
      position: relative;
    }
    .admin-foto-marco img {
      display: block;
      width: 100%;
      aspect-ratio: 3 / 4;
      object-fit: cover;
      border-radius: 10px;
    }
    .admin-foto-portada {
      position: absolute;
      top: 6px;
      left: 6px;
      background: #34483C;
      color: #F7F2E9;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 999px;
    }
    .admin-foto-boton {
      font: inherit;
      font-size: 12px;
      padding: 6px 4px;
      border: 1px solid #A6B39A;
      background: transparent;
      color: #34483C;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body class="pagina-admin">

  <header class="encabezado">
    <span class="logo">Flor de Prenda · Panel</span>
    <button class="admin-salir" id="salir" type="button" hidden>Cerrar sesión</button>
  </header>

  <main class="admin-contenedor">

    <!-- PANTALLA DE INGRESO -->
    <section id="pantalla-login" hidden>
      <h1>Ingresar</h1>
      <form id="form-login" class="admin-form">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="username" required>

        <label for="clave">Contraseña</label>
        <input id="clave" type="password" autocomplete="current-password" required>

        <p class="admin-error" id="login-error" hidden></p>
        <button class="boton admin-boton" type="submit">Entrar</button>
      </form>
    </section>

    <!-- PANTALLA DEL PANEL -->
    <section id="pantalla-panel" hidden>
      <div class="admin-cabecera-lista">
        <h1>Tus prendas</h1>
        <button class="boton admin-boton admin-boton-nuevo" id="btn-nueva" type="button">+ Nueva prenda</button>
      </div>
      <p class="admin-aviso" id="aviso-panel"></p>
<button class="admin-boton-secundario" id="btn-exportar" type="button">Descargar inventario (Excel)</button>
      <!-- FORMULARIO PARA CREAR / EDITAR -->
      <form id="form-prenda" class="admin-form admin-form-prenda" hidden>
        <h2 id="form-titulo">Nueva prenda</h2>
        <input type="hidden" id="p-id">

        <label for="p-nombre">Nombre</label>
        <input id="p-nombre" type="text" maxlength="120" placeholder="Ej: Blazer de lino" required>

        <label for="p-categoria">Categoría</label>
        <input id="p-categoria" type="text" list="lista-categorias" maxlength="60" placeholder="Ej: Vestidos" required>
        <datalist id="lista-categorias"></datalist>
        <div class="admin-sugerencias" id="p-categorias-sugeridas"></div>

        <label for="p-talle">Talle</label>
        <input id="p-talle" type="text" maxlength="20" placeholder="Ej: M, 40, Único" required>

        <label for="p-precio">Precio en pesos uruguayos</label>
        <input id="p-precio" type="number" inputmode="numeric" min="0" step="1" placeholder="Ej: 1490" required>

        <label for="p-descripcion">Descripción (opcional)</label>
        <textarea id="p-descripcion" rows="3" placeholder="Medidas, estado, composición..."></textarea>

        <label for="p-archivo">Fotos</label>
        <input id="p-archivo" type="file" accept="image/*" multiple>
        <div class="admin-fotos" id="p-fotos"></div>
        <p class="admin-ayuda" id="p-foto-estado">Podés elegir hasta 6 fotos. La primera es la portada. Se achican solas al subirlas.</p>

        <p class="admin-error" id="form-error" hidden></p>

        <div class="admin-botones-form">
          <button class="boton admin-boton" id="btn-guardar" type="submit">Guardar</button>
          <button class="admin-boton-secundario" id="btn-cancelar" type="button">Cancelar</button>
        </div>
      </form>

      <div id="lista-admin"></div>
    </section>

    <p class="admin-aviso" id="mensaje-inicial">Cargando…</p>
  </main>

  <script src="config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
